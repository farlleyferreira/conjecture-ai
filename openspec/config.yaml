schema: spec-driven

context: |
  Commits and PR titles must follow Conventional Commits (see CONTRIBUTING.md).
  Versioning is Semantic Versioning; version, Git tags, GitHub Releases and
  CHANGELOG.md are generated automatically by release-please. Every push to
  main updates a standing release PR; merging that PR (never a direct push
  to main) is what actually cuts the tag/release. Never hand-edit the
  version, CHANGELOG.md, or close a release PR without merging it.
  PRs into main merge via squash only and must pass the CI quality/security
  pipeline (commitlint, PR title check, lint/test, gitleaks, CodeQL,
  dependency review) before merge.
  Any change with a non-obvious technical decision must include a design.md
  documenting the decision and its rationale (this is the project's
  decision log; see openspec/changes/archive/ for past decisions).

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
# Example:
#   context: |
#     Designs and tasks must cover Windows, macOS, and Linux
#     Write all artifacts in Spanish

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
