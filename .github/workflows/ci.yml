name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint-and-test:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -race -cover
      # The release binaries for Linux and Windows are built without
      # CGO, and "go install" must work on a machine with no C
      # compiler - so that build has to keep compiling for every
      # released OS, and its CGO-free code paths have to keep passing.
      - name: CGO-free build and tests
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          for target in linux/amd64 linux/arm64 windows/amd64 windows/arm64 darwin/amd64 darwin/arm64; do
            GOOS="${target%/*}" GOARCH="${target#*/}" go build -o /dev/null ./cmd/conjecture
          done
          go test ./internal/languageagnosticcontracts ./internal/hardwarescheduler ./internal/sandbox
          go test ./cmd/conjecture -run 'Deps|ForbiddenImports'
      - name: Installer script syntax
        run: sh -n install.sh
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
